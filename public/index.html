<!DOCTYPE html>
<html lang="fi" data-skin="lasi" data-anim="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2369c9">
<meta name="description" content="Nykyinen sää, loppupäivän ja viiden päivän ennuste, sadetutka ja revontulivahti.">

<meta name="mobile-web-app-capable" content="yes">

<title>Sää</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Inter+Tight:wght@300;400;600&family=Space+Grotesk:wght@300;400;600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* VOICE: rauhallinen, ilmava, pohjoismainen — sää puhuu, käyttöliittymä vaikenee
   IDEA: ikkuna taivaalle; koko ruutu on säätila ja kortit ovat huurteista lasia sen edessä
   PICTURE: elävä taivas (canvas) joka puoliskolla itsenäisesti, animoidut SVG-ikonit
   COLOUR and TYPE: taivaan väri johdetaan säästä ja auringon korkeudesta; neljä teemaa, kullakin oma kirjasin
   LAYOUT: yksi tai kaksi itsenäistä paneelia, rinnakkain tai allekkain; sisältö max 760px */
:root{
  --font:'Manrope',system-ui,sans-serif;
  --ink:#fff;--ink2:rgba(255,255,255,.74);
  --card:rgba(10,20,36,.30);--card-b:rgba(255,255,255,.18);--stat:rgba(255,255,255,.08);
  --blur:18px;--shadow:0 10px 36px rgba(0,10,30,.18);--radius:22px;
  --accent:#ffd36b;--tshadow:0 1px 3px rgba(0,10,30,.28);
  --sheet:#121a27;--sheet-ink:#f2f5f9;--sheet-2:rgba(255,255,255,.07);
  --ic-sun:#ffc845;--ic-moon:#f3ecd2;--ic-cloud:#f6f8fb;--ic-cloud2:#c9d1db;--ic-cloud3:#a5afbd;--ic-drop:#6cc0ff;--ic-flake:#ffffff;
  --sel:rgba(255,255,255,.24);
}
html[data-skin=paperi]{
  --font:'Inter Tight',system-ui,sans-serif;
  --ink:#1b222a;--ink2:rgba(27,34,42,.66);
  --card:rgba(255,255,255,.80);--card-b:rgba(20,30,40,.09);--stat:rgba(20,30,40,.045);
  --blur:12px;--shadow:0 4px 18px rgba(30,40,50,.07);--radius:14px;
  --accent:#d4572a;--tshadow:none;
  --sheet:#fbfaf7;--sheet-ink:#1b222a;--sheet-2:rgba(20,30,40,.05);
  --ic-sun:#f2a516;--ic-moon:#b7a874;--ic-cloud:#c3cdd8;--ic-cloud2:#a6b2bf;--ic-cloud3:#7f8b99;--ic-drop:#2f8ae0;--ic-flake:#86a9cf;
  --sel:rgba(20,30,40,.10);
}
html[data-skin=yo]{
  --font:'Space Grotesk',system-ui,sans-serif;
  --ink:#e8edf4;--ink2:rgba(232,237,244,.62);
  --card:rgba(0,0,0,.62);--card-b:rgba(255,255,255,.10);--stat:rgba(255,255,255,.05);
  --blur:8px;--shadow:none;--radius:16px;--accent:#8ab4ff;
  --sheet:#07090c;--sheet-ink:#e8edf4;
}
html[data-skin=revontuli]{
  --font:'Sora',system-ui,sans-serif;
  --ink:#f0fff8;--ink2:rgba(240,255,248,.72);
  --card:rgba(4,30,38,.40);--card-b:rgba(120,255,200,.22);--stat:rgba(120,255,200,.07);
  --radius:26px;--accent:#5dffb0;--sheet:#062026;--sel:rgba(93,255,176,.22);
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#0b1020;color:var(--ink);font:16px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* yläpalkki */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;text-shadow:var(--tshadow);display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:var(--card);border:1px solid var(--card-b);border-radius:999px;padding:3px;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.seg button{min-width:44px;height:38px;padding:0 14px;border:0;background:none;border-radius:999px;font-size:15px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--sel)}
.tbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--card-b);background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.tbtn svg{width:20px;height:20px}
.tbtn.sm{width:40px;height:40px}
[hidden]{display:none!important}

/* paneelit */
.panes{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.panes[data-layout=split][data-orient=cols]{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panes[data-layout=split][data-orient=rows]{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.pane{position:relative;overflow:hidden;container-type:inline-size;background:linear-gradient(180deg,var(--sky1,#1c3b6a),var(--sky2,#6d9cc9));text-shadow:var(--tshadow)}
.panes[data-orient=cols] .pane+.pane{border-left:1px solid rgba(255,255,255,.16)}
.panes[data-orient=rows] .pane+.pane{border-top:1px solid rgba(255,255,255,.16)}
.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scrollp{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(68px + env(safe-area-inset-top)) max(clamp(12px,4cqi,32px),env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(clamp(12px,4cqi,32px),env(safe-area-inset-left));scrollbar-width:thin;overscroll-behavior:contain}
.panes[data-orient=rows] .pane+.pane .scrollp{padding-top:16px}
.inner{max-width:760px;margin:0 auto;display:grid;gap:14px}
.glass{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);backdrop-filter:blur(var(--blur)) saturate(140%);-webkit-backdrop-filter:blur(var(--blur)) saturate(140%);box-shadow:var(--shadow);padding:16px 18px}
h3{font-size:14px;font-weight:600;color:var(--ink2);margin:0 0 10px;letter-spacing:.01em}

.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.loc-btn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:clamp(24px,7cqi,38px);font-weight:600;letter-spacing:-.02em;line-height:1.1;text-align:left;min-height:44px}
.loc-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-btn svg{flex:none;width:20px;height:20px;opacity:.7}
.sub{color:var(--ink2);font-size:15px;margin-top:-4px}
.favs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--card-b);background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--sel);border-color:transparent}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 18px}
.hero .ic{width:clamp(92px,26cqi,140px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.bigt{font-size:clamp(60px,17cqi,108px);font-weight:300;line-height:.95;letter-spacing:-.05em;white-space:nowrap}
.cond{font-size:clamp(17px,4.4cqi,21px);font-weight:600;margin-top:6px}
.feels{font-size:16px;color:var(--ink2)}
.feels b{color:var(--ink);font-weight:600}
.stats{grid-column:1/-1;justify-self:stretch;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(132px,100%),1fr));gap:8px;margin-top:10px}
.stat{background:var(--stat);border-radius:14px;padding:9px 12px}
.stat small{display:block;color:var(--ink2);font-size:13px}
.stat b{font-size:17px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.stat em{font-style:normal;font-weight:400;color:var(--ink2);font-size:14px}
.arrow{width:16px;height:16px;flex:none}
.metrics{grid-column:1/-1;justify-self:stretch;display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:14px;padding-top:14px;border-top:1px solid var(--card-b)}
.mi{display:flex;align-items:center;gap:7px;font-size:17px;white-space:nowrap}
.mi b{font-weight:600}.mi em{font-style:normal;color:var(--ink2);font-size:15px}
.mic svg{width:24px;height:24px;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dgw{grid-column:1/-1;justify-self:stretch;margin-top:16px}
.dgh{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-bottom:2px}
.dgh b{color:var(--ink);font-weight:600}
.dg{position:relative;height:156px}
.dg svg{position:absolute;inset:0;overflow:visible}
.dg text{font:600 13px var(--font);fill:var(--ink)}
.dg text.ax{fill:var(--ink2);font-weight:500}
.dg text.ws{font-weight:600}

.nct{margin:0 0 12px;font-size:17px;line-height:1.45;text-wrap:pretty}
.ncb{display:flex;align-items:flex-end;gap:2px;height:46px}
.ncb i{flex:1;border-radius:3px 3px 1px 1px;background:var(--ic-drop);opacity:.18;min-height:3px}
.ncb i.w{opacity:1}
.ncax{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px;margin-top:4px}

.phen{display:grid;gap:10px}
.pc{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:start}
.pc .pi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--stat)}
.pc .pi svg{width:26px;height:26px}
.pc b{display:block;font-size:16px}
.pc p{margin:2px 0 0;color:var(--ink2);font-size:15px;text-wrap:pretty}
.pc.l2 .pi{background:rgba(255,120,90,.25)}
.pc.aur .pi{background:rgba(93,255,176,.2)}
.pline{font-size:15px;color:var(--ink2);padding:12px 16px}

.hscroll{overflow-x:auto;margin:0 -8px;padding:0 8px 4px;scrollbar-width:thin}
.hrow{position:relative;display:flex;width:max-content}
.hcol{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.ht{height:18px;line-height:18px;color:var(--ink2);font-weight:600}
.hcol .ic{width:32px;height:32px}
.hsp{height:64px}
.hcurve{position:absolute;left:0;top:58px;overflow:visible;pointer-events:none}
.hcurve text{font:600 14px var(--font);fill:var(--ink)}
.hp{width:10px;height:24px;display:flex;align-items:flex-end;background:var(--stat);border-radius:4px;overflow:hidden}
.hp i{display:block;width:100%;background:var(--ic-drop)}
.hpl{height:18px;color:var(--ink2);white-space:nowrap}
.hday{position:absolute;top:0;height:100%;border-left:1px dashed var(--card-b)}

.day{display:grid;grid-template-columns:4.6em 38px minmax(3.6em,1fr) 2.6em minmax(54px,2.2fr) 2.6em;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--card-b)}
.day:first-of-type{border-top:0}
.dn b{display:block;font-size:16px}
.dn small,.dp small{display:block;color:var(--ink2);font-size:13px}
.dp{font-size:14px;white-space:nowrap}
.day .ic{width:38px;height:38px}
.tmin{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.tmax{font-weight:600;font-variant-numeric:tabular-nums}
.rb{height:6px;border-radius:3px;background:var(--stat);position:relative}
.rb i{position:absolute;top:0;bottom:0;border-radius:3px}
@container (max-width:420px){
  .day{grid-template-columns:3.6em 32px minmax(0,1fr) 2.4em minmax(30px,1.4fr) 2.4em;gap:7px}
  .dp small{display:none}
  .hero{grid-template-columns:minmax(0,1fr);justify-items:start}
  .hero .ic{grid-row:1;width:84px}
}

.map{height:250px;border-radius:14px;overflow:hidden;position:relative;background:#0d1520;z-index:0}
.map canvas{position:absolute;inset:0;width:100%;height:100%}
.rbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.rbar .tbtn{flex:none}
.rbar .rt{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:7.5em}
.rbar a{color:inherit}
.leaflet-container{font:13px var(--font);background:#0d1520}
.leaflet-control-attribution{font-size:11px!important}
.src{font-size:13px;color:var(--ink2);text-align:center;padding:6px 0 4px}
.src a{color:inherit}
.err{padding:18px}
.err button{margin-top:10px}
.loading{opacity:.75;font-size:16px;padding:22px 18px}

/* ikonien liike */
.ic .rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.ic .cl{animation:drift 7s ease-in-out infinite alternate}
.ic .drop{animation:fall 1.15s linear infinite}
.ic .flake{animation:flk 2.8s linear infinite}
.ic .bolt{animation:flash 3.4s ease-in-out infinite}
.ic .fogl line{animation:drift 5s ease-in-out infinite alternate}
.ic .fogl line:nth-child(2){animation-delay:-2.5s}
.ic .moon{animation:bob 7s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-1.5px)}to{transform:translateX(2px)}}
@keyframes bob{from{transform:translateY(-1px)}to{transform:translateY(1.5px)}}
@keyframes fall{0%{transform:translateY(-5px);opacity:0}25%{opacity:1}100%{transform:translateY(8px);opacity:0}}
@keyframes flk{0%{transform:translate(0,-5px);opacity:0}25%{opacity:1}100%{transform:translate(2px,8px);opacity:0}}
@keyframes flash{0%,62%,72%,100%{opacity:.25}66%,70%{opacity:1}}
html[data-anim=off] .ic *{animation:none!important}
@media (prefers-reduced-motion:reduce){.ic *{animation:none!important}}

/* dialogit */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,8,16,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 12px;text-shadow:none}
.sheet{width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--sheet);color:var(--sheet-ink);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.sheet h2{font-size:22px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h4{font-size:14px;margin:18px 0 8px;opacity:.7;font-weight:600}
.sheet p.note{font-size:14px;opacity:.72;margin:6px 0 0}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--sheet-2);font-size:20px;line-height:1}
.inp{width:100%;height:48px;border-radius:12px;border:1px solid rgba(128,140,160,.35);background:var(--sheet-2);color:inherit;font:16px var(--font);padding:0 14px}
.list{display:grid;gap:4px;margin-top:10px}
.row{display:flex;align-items:center;gap:8px;border-radius:12px;background:var(--sheet-2)}
.row>button:first-child{flex:1;text-align:left;border:0;background:none;padding:10px 14px;min-height:48px}
.row small{display:block;opacity:.65;font-size:13px}
.star{width:44px;height:44px;border:0;background:none;font-size:20px;flex:none}
.star[aria-pressed=true]{color:#f5b301}
.wide{width:100%;min-height:46px;border-radius:12px;border:1px solid rgba(128,140,160,.35);background:var(--sheet-2);font-weight:600;margin-top:10px}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skin{border:2px solid transparent;border-radius:14px;padding:0;overflow:hidden;text-align:left;background:var(--sheet-2)}
.skin[aria-pressed=true]{border-color:var(--accent)}
.skin i{display:block;height:58px}
.skin span{display:block;padding:8px 10px 2px;font-weight:600}
.skin small{display:block;padding:0 10px 10px;font-size:13px;opacity:.7}
.sheet .seg{background:var(--sheet-2);border-color:transparent;backdrop-filter:none}
.sheet .seg button[aria-pressed=true]{background:var(--accent);color:#111}
.sel{height:46px;border-radius:12px;width:100%;font:16px var(--font);padding:0 12px;background:var(--sheet-2);color:inherit;border:1px solid rgba(128,140,160,.35)}
.sel option{color:#111}
.msg{font-size:14px;opacity:.75;margin-top:8px}

#banner{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(640px,calc(100% - 24px));display:flex;gap:12px;align-items:center;padding:12px 12px 12px 16px;font-size:14px;line-height:1.4;text-shadow:none}
#banner p{margin:0;flex:1}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="4" fill="#ffc845"/><path d="M8 19h9a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.4A3.4 3.4 0 0 0 8 19z" fill="#f6f8fb"/></svg>Sää</div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Näkymä">
      <button data-layout="single" aria-pressed="true">Yksi</button>
      <button data-layout="split" aria-pressed="false">Kaksi</button>
    </div>
    <div class="seg" id="orientSeg" role="group" aria-label="Jaon suunta" hidden>
      <button data-orient="cols" aria-label="Rinnakkain" title="Rinnakkain"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="16" height="14" rx="2.5"/><path d="M10 3v14"/></svg></button>
      <button data-orient="rows" aria-label="Allekkain" title="Allekkain"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="16" height="14" rx="2.5"/><path d="M2 10h16"/></svg></button>
    </div>
    <button class="tbtn" id="instBtn" aria-label="Asenna sovellus" title="Asenna sovellus" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg></button>
    <button class="tbtn" id="setBtn" aria-label="Asetukset ja teemat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
  </div>
</header>
<main id="panes" class="panes" data-layout="single" data-orient="cols"></main>
<div id="banner" class="glass" hidden><p></p><button class="x" data-close-banner aria-label="Sulje ilmoitus">×</button></div>
<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
/* ---------- perusapuvälineet ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const store={get(k,d){try{const v=localStorage.getItem('saa:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('saa:'+k,JSON.stringify(v))}catch(e){}}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const FC={};

    sky:base.startsWith('clearsky')?0:base.startsWith('fair')?1:base.startsWith('partlycloudy')||showers?2:3};
}

}

const cache=new Map();
const bases=()=>{const p=(S.proxy||'').trim().replace(/\/$/,'');return {met:p?p+'/met':'https://api.met.no',swpc:p?p+'/swpc':'https://services.swpc.noaa.gov'}};
async function getJSON(url,ttl=6e5){
  const c=cache.get(url);if(c&&Date.now()-c.t<ttl)return c.v;
  let r;try{r=await fetch(url)}catch(e){const er=new Error('net');er.net=true;throw er}
  if(!r.ok){const er=new Error('HTTP '+r.status);er.status=r.status;throw er}
  const v=await r.json();const off=r.headers.get('x-saa-offline')?+(r.headers.get('x-saa-saved')||0)||1:0;
  if(off&&v&&typeof v==='object')Object.defineProperty(v,'_offline',{value:off,enumerable:false});
  cache.set(url,{t:off?0:Date.now(),v});return v;
}
const r4=x=>Math.round(x*1e4)/1e4;
async function loadAll(loc){
  if(DEMO)return demoData(loc);
  const b=bases(),q=`lat=${r4(loc.lat)}&lon=${r4(loc.lon)}`;
  const fc=await getJSON(`${b.met}/weatherapi/locationforecast/2.0/complete?${q}`);
  const [nc,kp,ov]=await Promise.allSettled([
    getJSON(`${b.met}/weatherapi/nowcast/2.0/complete?${q}`,3e5),
    getJSON(`${b.swpc}/products/noaa-planetary-k-index-forecast.json`,18e5),
    getJSON(`${b.swpc}/json/ovation_aurora_latest.json`,9e5)]);
  return {fc,nc:nc.status==='fulfilled'?nc.value:null,kp:kp.value||null,ov:ov.value||null,offline:fc._offline||0};
}

function demoData(loc){

  for(let h=0;h<216;h+=h<60?1:6){

    const pr=parseSym(sym).type?D[3]/24*(parseSym(sym).inten||1)/1.5:0;

      next_1_hours:{summary:{symbol_code:sym},details:{precipitation_amount:+pr.toFixed(1),probability_of_thunder:0}},
      next_6_hours:{summary:{symbol_code:sym},details:{precipitation_amount:+(pr*6).toFixed(1)}}}});
  }
  const n0=new Date(Math.floor(Date.now()/3e5)*3e5);
  const nc={properties:{meta:{radar_coverage:'ok'},timeseries:Array.from({length:25},(_,i)=>({time:new Date(+n0+i*3e5).toISOString(),data:{instant:{details:{precipitation_rate:+sc.nc(i*5).toFixed(2),air_temperature:ts[0].data.instant.details.air_temperature}}}}))}};
  const d0=new Date();d0.setUTCHours(0,0,0,0);const kv=[2,2.33,1.67,2,3,3.67,4.33,4,3.33,2.67,2,2.33,3,3.33,3.67,3,2.67,2.33,2,2,2.33,2.67,3,2.67];
  const kp=kv.map((v,i)=>({time_tag:new Date(+d0+i*108e5).toISOString().slice(0,19),kp:v,observed:'predicted'}));
  return {fc:{properties:{timeseries:ts}},nc,kp,ov:null,scen:sc};
}

/* ---------- analyysi ---------- */
function feelsLike(t,v){if(t<=10&&v>1.3){const k=Math.pow(v*3.6,.16);return 13.12+.6215*t-11.37*k+.3965*t*k}return t}
function analyze(data,loc){
  const ts=data.fc.properties.timeseries.map(e=>({t:new Date(e.time),i:e.data.instant.details,n1:e.data.next_1_hours,n6:e.data.next_6_hours,n12:e.data.next_12_hours}));
  let k=0;ts.forEach((e,j)=>{if(+e.t<=Date.now())k=j});
  const c=ts[k],sym=(c.n1||c.n6||c.n12||{summary:{}}).summary.symbol_code||'cloudy';
  const cur={t:c.t,temp:c.i.air_temperature,feels:c.i.apparent_air_temperature??feelsLike(c.i.air_temperature,c.i.wind_speed),wind:c.i.wind_speed,gust:c.i.wind_speed_of_gust,dir:c.i.wind_from_direction,hum:c.i.relative_humidity,uv:c.i.ultraviolet_index_clear_sky,cloud:c.i.cloud_area_fraction,sym,p1:c.n1?.details?.precipitation_amount??0};
  const hours=[];
  for(let j=k;j<ts.length;j++){const e=ts[j];if(!e.n1)break;hours.push({t:e.t,temp:e.i.air_temperature,dir:e.i.wind_from_direction??0,sym:e.n1.summary.symbol_code,p:e.n1.details?.precipitation_amount||0,wind:e.i.wind_speed,gust:e.i.wind_speed_of_gust??e.i.wind_speed,cloud:e.i.cloud_area_fraction??50,thunder:e.n1.details?.probability_of_thunder||0,hum:e.i.relative_humidity})}
  const today=dayKey(new Date(),loc.tz),map=new Map();
  ts.forEach((e,j)=>{
    const key=dayKey(e.t,loc.tz);if(!map.has(key))map.set(key,{key,t:e.t,temps:[],p:0,wind:0,sym:null,sd:99});
    const d=map.get(key);d.temps.push(e.i.air_temperature);d.wind=Math.max(d.wind,e.i.wind_speed_of_gust??e.i.wind_speed);
    const gap=j<ts.length-1?(ts[j+1].t-e.t)/36e5:0;
    if(gap>.9&&gap<1.1)d.p+=e.n1?.details?.precipitation_amount||0;else if(gap>5.9&&gap<6.1)d.p+=e.n6?.details?.precipitation_amount||0;
    const lh=lHour(e.t,loc.tz),dist=Math.abs(lh-12.5);const sc=e.n6||e.n12||e.n1;
    if(sc&&dist<d.sd){d.sd=dist;d.sym=sc.summary.symbol_code}
  });

  return {cur,hours,hourly:hours.slice(0,25),days,sun:sunTimes(loc)};
}
function parseKp(j){
  if(!Array.isArray(j)||!j.length)return [];let rows=j;
  if(Array.isArray(j[0])){const keys=j[0];rows=j.slice(1).map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]])))}
  return rows.map(r=>{const tt=r.time_tag||r.time||r.TimeTag,kp=+(r.kp??r.Kp??r.kp_index??r.estimated_kp);if(!tt||isNaN(kp))return null;
    const t=new Date(/Z$|[+-]\d\d:?\d\d$/.test(tt)?tt:String(tt).replace(' ','T')+'Z');return isNaN(t)?null:{t,kp}}).filter(Boolean).sort((a,b)=>a.t-b.t);
}
function ovationAt(ov,lat,lon){
  if(!ov||!Array.isArray(ov.coordinates))return null;
  if(!ov._m){ov._m=new Map();for(const c of ov.coordinates)ov._m.set(c[0]+','+c[1],c[2])}
  const L=((Math.round(lon)%360)+360)%360;let m=0;
  for(let dy=0;dy<=4;dy++){const v=ov._m.get(L+','+Math.round(lat+dy));if(v!=null)m=Math.max(m,v*(dy?.75:1))}
  return m;
}
function aurora(data,A,loc){
  const hrs=A.hours.slice(0,20).map(h=>({t:h.t,cloud:h.cloud,alt:sunAlt(h.t,loc.lat,loc.lon)})).filter(h=>h.alt<-10);
  if(!hrs.length)return null;
  const kps=parseKp(data.kp),need=Math.max(.5,1.5+(68-loc.lat)*.4),ovP=ovationAt(data.ov,loc.lat,loc.lon);
  const kpAt=t=>{let b=null;for(const x of kps)if(x.t<=t&&t-x.t<3*36e5)b=x;return b?b.kp:null};
  let maxKp=0;
  hrs.forEach(h=>{const kp=kpAt(h.t);if(kp!=null)maxKp=Math.max(maxKp,kp);
    let act=kp==null?0:clamp((kp-need+1.2)/2.2,0,1);

    h.act=act;h.clear=clamp(1-(h.cloud-10)/70,0,1);h.s=act*h.clear});

  let wide=false;if(i1-i0>=4){wide=true;let bj=i0,bs=-1;for(let j=i0;j<=i1-2;j++){const sm=hrs[j].s+hrs[j+1].s+hrs[j+2].s;if(sm>bs){bs=sm;bj=j}}i0=bj;i1=bj+2}
  const win=`klo ${hm(hrs[i0].t,tz)}–${hm(new Date(+hrs[i1].t+36e5),tz)}`;
  const avgCloud=hrs.slice(i0,i1+1).reduce((a,h)=>a+h.cloud,0)/(i1-i0+1);

  else if(best.s>=.35){lvl=2;text=`Revontulet ovat tänä yönä todennäköisiä, ja ${sky}. Paras hetki on ${win}; katso pohjoiseen, poissa katuvaloista.`}
  else if(best.s>=.18){lvl=1;text=`Revontulia voi mahdollisesti näkyä ${win} pohjoisella taivaalla.`}
  else if(maxAct>=.45)text=`Revontuliaktiivisuus on korkealla, mutta pilvet peittävät taivaan todennäköisesti koko yön.`;

modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});
const CITIES=[['Helsinki','Uusimaa',60.1699,24.9384],['Espoo','Uusimaa',60.2055,24.6559],['Vantaa','Uusimaa',60.2934,25.0378],['Tampere','Pirkanmaa',61.4978,23.761],['Turku','Varsinais-Suomi',60.4518,22.2666],['Oulu','Pohjois-Pohjanmaa',65.0121,25.4651],['Jyväskylä','Keski-Suomi',62.2426,25.7473],['Kuopio','Pohjois-Savo',62.8924,27.677],['Lahti','Päijät-Häme',60.9827,25.6612],['Pori','Satakunta',61.4851,21.7974],['Joensuu','Pohjois-Karjala',62.601,29.7636],['Lappeenranta','Etelä-Karjala',61.0587,28.1887],['Vaasa','Pohjanmaa',63.096,21.6158],['Seinäjoki','Etelä-Pohjanmaa',62.7903,22.8403],['Kajaani','Kainuu',64.2245,27.7334],['Rovaniemi','Lappi',66.5039,25.7294],['Kemi','Lappi',65.7364,24.5637],['Sodankylä','Lappi',67.4167,26.5833],['Kittilä (Levi)','Lappi',67.8,24.8],['Inari','Lappi',68.9058,27.0281],['Utsjoki','Lappi',69.9078,27.0283],['Kilpisjärvi','Lappi',69.0478,20.7911],['Maarianhamina','Ahvenanmaa',60.0973,19.9348],['Hanko','Uusimaa',59.8236,22.9681],['Savonlinna','Etelä-Savo',61.8687,28.8786],['Kuusamo','Pohjois-Pohjanmaa',65.9667,29.1833],['Tukholma','Ruotsi',59.3293,18.0686],['Tallinna','Viro',59.437,24.7536],['Oslo','Norja',59.9139,10.7522],['Tromssa','Norja',69.6492,18.9553]]
  .map(([n,r,la,lo])=>({name:n,region:r+(r==='Ruotsi'||r==='Viro'||r==='Norja'?'':', Suomi'),lat:la,lon:lo,tz:r==='Ruotsi'?'Europe/Stockholm':r==='Norja'?'Europe/Oslo':r==='Viro'?'Europe/Tallinn':r==='Ahvenanmaa'?'Europe/Mariehamn':'Europe/Helsinki'}));
const isFav=l=>S.favs.some(f=>sameLoc(f,l));
function toggleFav(l){const i=S.favs.findIndex(f=>sameLoc(f,l));if(i>=0)S.favs.splice(i,1);else{if(S.favs.length>=5)return 'Suosikkeja voi olla enintään viisi.';S.favs.push(l)}save();$$('.pane').forEach(p=>{const L0=S.locs[+p.dataset.i];$('.s-head',p).innerHTML=headHTML(L0)})}
function rowsHTML(list){return list.map((l,j)=>`<div class="row"><button data-pick="${j}"><b>${esc(l.name)}</b><small>${esc(l.region||'')}</small></button><button class="star" data-star="${j}" aria-pressed="${isFav(l)}" aria-label="${isFav(l)?'Poista suosikeista':'Lisää suosikkeihin'}">${isFav(l)?'★':'☆'}</button></div>`).join('')}
function openLoc(pi){
  let list=S.favs.slice(),tm=0;
  openModal(`<h2>Valitse paikkakunta <button class="x" data-close aria-label="Sulje">×</button></h2>
    <input class="inp" id="q" type="search" placeholder="Hae kaupunkia tai kylää" autocomplete="off" aria-label="Hae paikkakuntaa">
    <button class="wide" id="geo">Käytä nykyistä sijaintiani</button><div class="msg" id="lm"></div>
    <h4 id="lh">Suosikit (${S.favs.length}/5)</h4><div class="list" id="res">${rowsHTML(list)}</div>`,el=>{
    const res=$('#res',el),lm=$('#lm',el),lh=$('#lh',el);
    const draw=()=>{res.innerHTML=rowsHTML(list)||'<div class="msg">Ei tuloksia.</div>'};
    $('#q',el).addEventListener('input',e=>{const q=e.target.value.trim();clearTimeout(tm);
      if(!q){list=S.favs.slice();lh.textContent=`Suosikit (${S.favs.length}/5)`;return draw()}
      lh.textContent='Hakutulokset';const ql=q.toLocaleLowerCase('fi');
      list=CITIES.filter(c=>c.name.toLocaleLowerCase('fi').startsWith(ql));draw();
      if(q.length<2||DEMO)return;
      tm=setTimeout(async()=>{try{const j=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=fi&format=json`,864e5);
        const more=(j.results||[]).map(r=>({name:r.name,region:[r.admin1,r.country].filter(Boolean).join(', '),lat:r.latitude,lon:r.longitude,tz:r.timezone||'Europe/Helsinki'}));
        list=[...list,...more.filter(m=>!list.some(x=>sameLoc(x,m)))];draw()}catch(e){}},320)});
    res.addEventListener('click',e=>{const s=e.target.closest('[data-star]');if(s){const m=toggleFav(list[+s.dataset.star]);lm.textContent=m||'';draw();return}
      const b=e.target.closest('[data-pick]');if(b){choose(pi,list[+b.dataset.pick])}});
    $('#geo',el).addEventListener('click',()=>{if(!navigator.geolocation){lm.textContent='Selain ei tue sijaintia.';return}lm.textContent='Haetaan sijaintia…';
      navigator.geolocation.getCurrentPosition(pos=>choose(pi,{name:'Oma sijainti',region:`${f1(pos.coords.latitude)}° N, ${f1(pos.coords.longitude)}° E`,lat:pos.coords.latitude,lon:pos.coords.longitude,tz:Intl.DateTimeFormat().resolvedOptions().timeZone}),
        ()=>{lm.textContent='Sijaintia ei saatu. Salli sijainti selaimen asetuksista tai hae paikkakuntaa nimellä.'},{timeout:9000,maximumAge:6e5})});
  });
}
function choose(pi,l){S.locs[pi]={...l};save();closeModal();const p=$(`.pane[data-i="${pi}"]`);if(p){$('.s-hero',p).innerHTML='<div class="loading">Haetaan säätietoja…</div>';renderPane(p)}}
const SKINS=[['lasi','Lasi','Huurteiset kortit elävän taivaan edessä','linear-gradient(160deg,#2a7fdc,#8cc8f5)'],['paperi','Paperi','Vaalea ja hillitty, tumma teksti','linear-gradient(160deg,#dfe6ee,#faf8f3)'],['yo','Yö','Musta OLED-pohja, säästää akkua','linear-gradient(160deg,#05070b,#1a2233)'],['revontuli','Revontuli','Syvä turkoosi ja revontulen vihreä','linear-gradient(160deg,#05202a,#0c3a3c 60%,#2a8f6a)']];
const PREV=[['auto','Todellinen sää'],['clear','Aurinkoinen'],['partly','Puolipilvinen'],['cloudy','Pilvinen'],['rain','Sade'],['heavy','Rankkasade'],['storm','Ukkonen'],['snow','Lumisade'],['sleet','Räntä'],['fog','Sumu'],['sunset','Auringonlasku'],['night','Kirkas yö ja revontulet']];
function openSettings(){
  openModal(`<h2>Asetukset <button class="x" data-close aria-label="Sulje">×</button></h2>
   <h4>Teema</h4><div class="skins">${SKINS.map(([k,n,d,bg])=>`<button class="skin" data-skin="${k}" aria-pressed="${S.skin===k}"><i style="background:${bg}"></i><span>${n}</span><small>${d}</small></button>`).join('')}</div>
   <h4>Animaatiot</h4><div class="seg" role="group" aria-label="Animaatiot">${[['full','Täysi'],['lite','Kevyt'],['off','Pois']].map(([k,n])=>`<button data-anim="${k}" aria-pressed="${S.anim===k}">${n}</button>`).join('')}</div>
   <p class="note">Kevyt-tila puolittaa partikkelit ja ruudunpäivityksen, mikä säästää akkua. Animaatiot pysähtyvät aina, kun välilehti ei ole näkyvissä.</p>
   <h4>Säätehosteen esikatselu</h4><select class="sel" id="pv" aria-label="Säätehosteen esikatselu">${PREV.map(([k,n])=>`<option value="${k}" ${S.preview===k?'selected':''}>${n}</option>`).join('')}</select>
   <p class="note">Näytä koko ruudun taustatehoste valitulla säätilalla. Ennusteen tiedot eivät muutu.</p>
   <h4>Suosikit (${S.favs.length}/5)</h4><div class="list">${S.favs.map((f,j)=>`<div class="row"><button data-gofav="${j}"><b>${esc(f.name)}</b><small>${esc(f.region||'')}</small></button><button class="star" data-unfav="${j}" aria-pressed="true" aria-label="Poista ${esc(f.name)} suosikeista">★</button></div>`).join('')||'<div class="msg">Lisää suosikkeja paikkakuntahaun tähdellä.</div>'}</div>
   <h4>Asenna sovellus</h4><div id="instBox">${installHTML()}</div>
   <h4>Datayhteys</h4><input class="inp" id="px" placeholder="https://saa-proxy.oma-tili.workers.dev" value="${esc(S.proxy)}" aria-label="Välityspalvelimen osoite">
   <p class="note">Valinnainen välityspalvelin (Cloudflare Worker), joka lisää yr.no:n vaatiman User-Agent-tunnisteen ja välimuistin. Tyhjänä haut tehdään suoraan selaimesta.${DEMO?' <b>Nyt käytössä esikatseludata.</b>':''}</p>`,el=>{
    el.addEventListener('click',e=>{
      const sk=e.target.closest('button.skin');if(sk){S.skin=sk.dataset.skin;save();applyGlobal();$$('[data-skin]',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.skin===S.skin));$$('.pane').forEach(p=>{applySky(p);const m=$('.map',p);if(m&&!DEMO){m.dataset.key=''}radarInit(p,S.locs[+p.dataset.i])})}
      const an=e.target.closest('button[data-anim]');if(an){S.anim=an.dataset.anim;save();applyGlobal();$$('[data-anim]',el).forEach(b=>b.setAttribute('aria-pressed',b.dataset.anim===S.anim));$$('.pane').forEach(applySky)}
      const uf=e.target.closest('[data-unfav]');if(uf){S.favs.splice(+uf.dataset.unfav,1);save();openSettings();$$('.pane').forEach(p=>$('.s-head',p).innerHTML=headHTML(S.locs[+p.dataset.i]))}
      const gf=e.target.closest('[data-gofav]');if(gf)choose(0,S.favs[+gf.dataset.gofav]);
    });
    $('#instBox',el).addEventListener('click',e=>{if(e.target.closest('[data-install]'))doInstall().then(()=>{const b=$('#instBox',el);if(b)b.innerHTML=installHTML()})});
    $('#pv',el).addEventListener('change',e=>{S.preview=e.target.value;save();$$('.pane').forEach(applySky)});
    onClose=()=>{const v=($('#px',el)?.value||'').trim();if(v!==S.proxy){S.proxy=v;save();cache.clear();DEMO=false;$('#banner').hidden=true;$$('.map').forEach(m=>m.dataset.key='');renderAll()}};
  });
}
function applyGlobal(){document.documentElement.dataset.skin=S.skin;document.documentElement.dataset.anim=S.anim}

/* ---------- tapahtumat ---------- */
$('.top').addEventListener('click',e=>{
  const l=e.target.closest('button[data-layout]');if(l){S.layout=l.dataset.layout;save();layout()}
  const o=e.target.closest('button[data-orient]');if(o){S.orient=o.dataset.orient;save();layout()}
  if(e.target.closest('#setBtn'))openSettings();
});
$('#panes').addEventListener('click',e=>{
  const p=e.target.closest('.pane');if(!p)return;const i=+p.dataset.i;
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='loc')openLoc(i);
    if(act==='refresh'){cache.clear();renderPane(p)}
    if(act==='rplay'&&p._radar){p._radar.play=!p._radar.play;a.innerHTML=p._radar.play?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}}
  const f=e.target.closest('[data-fav]');if(f)choose(i,S.favs[+f.dataset.fav]);
});
$('[data-close-banner]').addEventListener('click',()=>$('#banner').hidden=true);


/* ---------- asennettava sovellus (PWA) ---------- */
let instEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installHTML(){
  if(standalone())return '<p class="note">Sää on asennettu tälle laitteelle.</p>';
  if(instEvt)return '<button class="wide" data-install>Asenna Sää tälle laitteelle</button><p class="note">Sovellus avautuu omaan ikkunaansa ilman selaimen palkkeja ja näyttää viimeisimmän ennusteen myös ilman verkkoa.</p>';
  if(isIOS())return '<p class="note">iPhonessa ja iPadissa: avaa sivu Safarissa, napauta <b>Jaa</b>-painiketta ja valitse <b>Lisää Koti-valikkoon</b>.</p>';
  return '<p class="note">Valitse selaimen valikosta <b>Asenna sovellus</b> tai <b>Lisää aloitusnäyttöön</b>. Firefox tietokoneella ei tue asentamista.</p>';
}
async function doInstall(){if(!instEvt)return;instEvt.prompt();try{await instEvt.userChoice}catch(e){}instEvt=null;$('#instBtn').hidden=true}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;$('#instBtn').hidden=false});
addEventListener('appinstalled',()=>{instEvt=null;$('#instBtn').hidden=true});
$('#instBtn').addEventListener('click',doInstall);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})})}
addEventListener('online',()=>{cache.clear();renderAll()});

/* ---------- silmukka ---------- */
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S.anim!=='off'&&!document.hidden){for(const s of skies)s.draw(dt);for(const r of radarSims)r.draw(dt)}
  requestAnimationFrame(loop)}
setInterval(()=>{$$('.pane').forEach(p=>{const c=$('.clk',p),l=S.locs[+p.dataset.i];if(c&&l)c.textContent=hm(new Date(),l.tz);applySky(p);dayGraph(p)})},6e4);
setInterval(()=>{if(!document.hidden)renderAll()},10*6e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)$$('.pane').forEach(applySky)});

applyGlobal();layout();
if(S.anim==='off')setTimeout(()=>radarSims.forEach(r=>r.draw(0)),300);
requestAnimationFrame(loop);
}
</script>
</body>
</html>
